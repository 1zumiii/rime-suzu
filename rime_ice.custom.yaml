# 个人雾凇拼音补丁。用 .custom.yaml 而不是直接改官方文件，同步上游时不会冲突。

patch:
  # 模糊音 + 邻键误触容错：规则由 tools/gen_typo_rules.py 生成到 algebra_extra.yaml，追加到官方拼写规则之后
  # 注意：不能用 __patch 引用带 /+ 的补丁，那样会整体替换官方规则（缩写会失效）
  "speller/algebra/+":
    __include: algebra_extra:/rules

  # ---------- 1. 最近使用优先（lua/recent_boost_filter.lua） ----------
  # 插在 pin_cand_filter 之前（第 4 位），置顶词仍然在最前面
  "engine/filters/@before 4": lua_filter@*recent_boost_filter
  recent_boost_filter:
    window_hours: 72   # 多少小时内用过算「最近」
    idx: 2             # 提升到第几个候选位置（1 = 最前面）
    max_boost: 2       # 最多提升几个词
    scan: 40           # 只在前 N 个候选里找
    min_count: 1       # 窗口内至少用过几次才提升
    max_records: 3000  # 记录文件最多保留多少条使用记录
    pairs: true        # 个人词对：记住「前一个词→当前词」，同样的搭配再次出现时优先（lua/personal_pairs.lua，记录在 recent_pairs.tsv）
    min_pair: 1.5      # 词对计数至少多大才提升（约需重复出现两次，单次偶然搭配或误选不提升；14 天衰减到 1/e）

  # ---------- 2. 冷词降频 / 删词（lua/cold_word_drop，已随官方提供） ----------
  # Control+j 降频到第 4 位，Control+x 隐藏，Control+d 强制删词
  "engine/processors/@after 0": lua_processor@*cold_word_drop.processor
  "engine/filters/@before last": lua_filter@*cold_word_drop.filter

  # ---------- 3. 英文、自定义短语也随使用调整 ----------
  melt_eng/enable_user_dict: true      # 英文词随使用调频
  custom_phrase/db_class: tabledb      # custom_phrase.txt 可动态调频（会回写该文件）

  # ---------- 4. 语法模型（需要先下载 wanxiang-lts-zh-hans.gram，见 README.md） ----------
  # 模型文件不存在时 librime 会忽略这几项，不影响输入
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5
    collocation_min_length: 2
  translator/contextual_suggestions: true
  translator/max_homophones: 7
  translator/max_homographs: 7

  # ---------- 5. 语法模型标记（lua/model_badge_filter.lua） ----------
  # 整句组出来的候选后面加 ❖；放在 cn_en_spacer 之后，保证在 corrector 之后
  "engine/filters/@before 7": lua_filter@*model_badge_filter
  model_badge_filter:
    badge: "❖"
    gram: wanxiang-lts-zh-hans.gram

  # ---------- 6. 中英混输词条自动空格（lua/cn_en_spacer.lua） ----------
  # 「VIP中P」→「VIP 中 P」。插在 pin_cand_filter 之后；
  # 补丁键按字典序依次生效，下标依赖上面 @before 4 的插入，改动过滤器列表时要一起检查。
  "engine/filters/@before 6": lua_filter@*cn_en_spacer

  # ---------- emoji 推迟到第二页（lua/emoji_defer_filter.lua） ----------
  # 第一页只放文字候选，emoji 从第 page_size+1 位开始。必须在 simplifier@emoji 之后。
  # 用 @after 10：10 是官方 filters 列表里 uniquifier 的下标（补丁键按字典序生效，
  # "@after 10" 先于 "@after last" 和所有 "@before …" 生效，所以下标仍然指向官方原列表）。
  # 官方调整过滤器列表后这个下标要跟着改；tools/verify_build.sh 会检查顺序。
  "engine/filters/@after 10": lua_filter@*emoji_defer_filter

  # ---------- 8. AI 重排（实验）----------
  # 本地小模型按上文（应用里光标前的文字，读不到时用本会话上屏的内容）重排候选，详见 suzu-ime 仓库的 macos/README.md。
  # 需要先安装 rime_llm.so 和模型；没装时这两个组件什么都不做（开关关闭时直接放行/透传）。
  # 开关：默认开；Control+Shift+5 或方案菜单（F4 / Control+`）里的「AI 关/开」可在当前输入框临时切换。
  # 位置：processor 放最前，filter 放最后（uniquifier 之后）；这两个位置各只能给一个组件用。
  "engine/processors/@before 0": lua_processor@*ai_rerank_processor
  # 光标上文：读应用里光标前的文字作上文（macOS 经辅助功能接口，须给鼠须管授权；Android 由改版 Trime 提供），
  # 读不到退回上屏历史；紧跟在 ai_rerank_processor 之后，见 lua/ai_rerank_app_ctx.lua。
  # llm_rerank/context_source: history 可临时只用上屏历史。
  "engine/processors/@before 1": lua_processor@*ai_rerank_app_ctx
  "engine/filters/@after last": lua_filter@*ai_rerank_filter
  # 默认开（reset: 1）：鼠须管的开关状态是每个应用/输入框各管各的，新输入框会回到默认状态，
  # 所以默认值必须是开；Control+Shift+5 只在当前输入框里临时开/关。
  # 注意：同一个键在 YAML 里只能出现一次，两个开关要用 "switches/+" 一次追加，不能写两行 "switches/@next"（后者会把前者挤掉）
  "switches/+":
    - { name: ai_rerank, reset: 1, states: [ "AI 关", "AI 开" ], abbrev: [ "AI关", "AI开" ] }
  # 四字以上输入的第二阶段推理（上屏第一段后，对剩余拼音再打分）。单独成开关，默认开；需要 llm_rerank/stage2 同时为 true。
  # 手机上实测（Suzu-2，debug_latency 393 次按键）：第二阶段中位 3.7 ms、最大 19.6 ms，不影响手感；怀疑它有问题时在三个点面板里切到「单段」。
    - { name: ai_stage2, reset: 1, states: [ "单段", "两段" ], abbrev: [ "单", "两" ] }
  # 快捷键切换 AI（不用进方案菜单）。Control+Shift+3/4 已被默认配置占用（中英标点、简繁）
  key_binder/bindings:
    - { when: always, toggle: ai_rerank, accept: "Control+Shift+5" }
    - { when: always, toggle: ai_rerank, accept: "Control+Shift+percent" }
  llm_rerank:
    code_pattern: '[a-z]{2,}'   # 2 个字母及以上的输入触发（简拼 zm 这类也重排；单个字母不重排，避开置顶词）
    max_candidates: 10          # 单字等同音词多的输入，正确的字常排在词库第 6 到 8 位；候选少了就根本进不了重排（实测 5 个时单字约 77% 进得来，8 个约 95%）
    max_tokens: 10
    expected_length_weight: 0   # 全拼保持 0
    freq_beta: 1.5
    pair_gamma: 1.5             # 个人词对融合系数（前一个词→当前词的使用习惯），0 = 关闭
    scan_limit: 80
    select_anchor_rate: 1.0     # 选词语料里“重排没改动的普通选词”的记录比例，默认 0.1；调到 1.0 让语料积累更快（文件只在本机）
    idle_unload_minutes: 20     # 空闲这么多分钟没打字就卸载模型（还回约 320 MB 内存），下次打字自动加载（约 1 秒）；0 = 不卸载
    badge: "◇"                  # 模型参与了排序的首选（含与 Rime 原首位相同的；单字符省空间）
    badge2: "◈"                 # 两阶段拼出来的首选（四字 = 两个两字词）
    unified:                   # 统一排序（默认排序方式，总分 = Rime 名次先验 + λ(上文)·模型分 + 个人习惯）的参数；候选生成同样默认开启，见 suzu-ime rime/lua/rank_unified.lua
      alpha: 0.05              # 名次先验的系数，取很小的值。留出集简拼上，系数 0.25 比 0 低约 8 个点，全拼上没有差别；先验只在上文完全错误时有约 3 个点的保护，那种情况应由上文可靠性判断处理。默认 1.0 过大
      top_gate: 2.5            # 首位门控：模型换首位时，新首位的模型分要比不用模型时的首位高出这么多才换。Mac 真实使用里分差不到 3 时 AI 改首位约一半是错的（用户接受后删掉改回），见 suzu-ime rime/lua/rank_unified.lua
    #   lam_max: 1.0           # 模型分的最大权重
    #   lam_ctx_full: 4        # 上文达到这么多字时模型权重到顶
    # input_log_days: 30       # 输入事件流（用户目录有 input_log.enabled 时记录）的保留天数
    # debug_latency: true      # 排查用：只记录跳过原因和耗时（llm_errors.txt / llm_latency.txt），不含任何输入文字
    # cpu_cores: 4              # 实测 4 线程最合适
    # model_path: '~/Library/Rime/Qwen3.5-0.8B-Q4_K_M.gguf'   # 默认就是这个位置
