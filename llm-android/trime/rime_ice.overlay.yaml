  # ---- 手机（Trime）专属：部署时追加到 rime_ice.custom.yaml 的 patch 末尾 ----
  # 四字词的第二阶段要在输入线程上现场解码上文，手机 CPU 上每次约 100~200 ms（偶发数秒），打字时能明显感觉到卡。
  # Mac（Metal）和 PC 上这一步只要几毫秒。Suzu 学生模型下实测第二阶段中位几毫秒，因此保持「两段」开关默认开，
  # 需要时在三个点的开关面板里切到「单段」。
  llm_rerank/stage2: true
  # 轻量档：手机 CPU 上实测（空闲时，新候选打分）：5 个候选 p50≈118 ms / 最大 217 ms；3 个候选 p50≈78 ms / 最大 124 ms。
  # 上文 token 10→6 缩短上屏后的后台预解码（耗电发热的大头）。
  llm_rerank/max_candidates: 9      # 守护进程 n-seq-max 为 10，候选最多 9 个
  llm_rerank/max_tokens: 6
  # 选词语料里“重排没改动的普通选词”的记录比例，默认 0.1；调到 1.0 让语料积累更快（文件只在手机本机）
  llm_rerank/select_anchor_rate: 1.0
  # 统一排序（总分 = Rime 原名次先验 + λ(上文)·模型分 + 个人习惯）与候选生成已是默认；下面只调名次先验的系数
  # 名次先验的系数取很小的值：留出集简拼上 0.25 比 0 低约 8 个点，全拼上没有差别；与 Lua 默认值相同
  llm_rerank/unified/alpha: 0.05
  # 手动启停（点工具栏的 AI 徽标）：不自动卸载，开着就一直在线；关闭时模型立刻卸载、推理进程只剩待命。
  llm_rerank/idle_unload_minutes: 0
  # 简拼和短输入（2 个字母起）也参与重排；学生模型打分只要十几毫秒
  llm_rerank/code_pattern: '[a-z]{2,}'
  # 置信度门控：模型首位比 Rime 原首位的融合分高出至少这么多才换；简拼的候选多，门槛更高。
  # 初值是估计，等选词统计攒够数据后按 select_stats_report 里的 margin 分桶结果调整
  llm_rerank/gate_margin: 0.5
  llm_rerank/gate_margin_short: 1.5
  # AI 开关与其他平台一样默认开启（reset: 1）。点工具栏 AI 徽标切换的开关不会写进 save_options，
  # Trime 重启或重新部署后回到默认值；默认值若为关，熄屏后进程被回收再拉起时 AI 会被关掉。
