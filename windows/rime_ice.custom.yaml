# Windows(小狼毫) 专用的雾凇拼音补丁。安装时会覆盖用户目录里的 rime_ice.custom.yaml。
# 与根目录(Mac)版的区别：
#   - recent_boost_filter 保留（记录个人词对与纠错记忆，AI 重排读取它们；AI 重排放在过滤器最后，会按融合分重排）
#   - 去掉 model_badge_filter（LLM 插件自己有 AI· 标记，且两者会争用 @after last）
#   - cn_en_spacer 的下标因 recent_boost_filter 插在第 4 位而改成 @before 6
#   - cold_word_drop 的 processor 改用 @after 0，把 @before 0 留给 LLM 的 processor
# 注意：补丁键按字典序依次生效，改过滤器/处理器列表时要一起检查下标。

patch:
  # 模糊音（平翘舌、前后鼻音）。邻键纠错默认关闭，见 tools/gen_typo_rules.py
  # 不能用 __patch 引用带 /+ 的补丁文件，那样会整体替换官方拼写规则（简拼会失效）
  "speller/algebra/+":
    __include: algebra_extra:/rules

  # 最近使用优先 + 个人词对（lua/recent_boost_filter.lua、lua/personal_pairs.lua）：插在 pin_cand_filter 之前（第 4 位）
  "engine/filters/@before 4": lua_filter@*recent_boost_filter
  recent_boost_filter:
    window_hours: 72
    idx: 2
    max_boost: 2
    scan: 40
    min_count: 1
    max_records: 3000
    pairs: true
    min_pair: 1.5

  # 冷词降频/屏蔽：Control+j 降频，Control+x 隐藏，Control+d 强制删词
  # LLM 只能重排不能删候选，所以这个是互补的
  "engine/processors/@after 0": lua_processor@*cold_word_drop.processor
  "engine/filters/@before last": lua_filter@*cold_word_drop.filter

  # 中英混输词条自动空格，插在 pin_cand_filter 之后（recent_boost_filter 插入后 pin 是第 5 位，所以 @before 6）
  "engine/filters/@before 6": lua_filter@*cn_en_spacer

  # 英文、自定义短语也随使用调频
  melt_eng/enable_user_dict: true
  custom_phrase/db_class: tabledb

  # 语法模型（需要把 wanxiang-lts-zh-hans.gram 放进用户目录，且 rime.dll 要带 octagram 插件，见 README.md）
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5
    collocation_min_length: 2
  translator/contextual_suggestions: true
  translator/max_homophones: 7
  translator/max_homographs: 7

  # ---------- emoji 推迟到第二页（lua/emoji_defer_filter.lua） ----------
  # 第一页只放文字候选，emoji 从第 page_size+1 位开始。必须在 simplifier@emoji 之后。
  # 用 @after 10：10 是官方 filters 列表里 uniquifier 的下标（补丁键按字典序生效，
  # "@after 10" 先于 "@after last" 和所有 "@before …" 生效，所以下标仍然指向官方原列表）。
  # 官方调整过滤器列表后这个下标要跟着改；tools/verify_build.sh 会检查顺序。
  "engine/filters/@after 10": lua_filter@*emoji_defer_filter

  # ---------- LLM 重排（rime-llm-rerank，Windows 补丁见 llm-windows/）：默认注释掉 ----------
  # 模型：用户目录放 suzu.gguf 与 suzu.vocab.txt 就自动用 Suzu（字符级学生模型）；model_path 只在想用其他模型时才写。
  # LLM 的 processor 要放在 processors 最前，filter 要放在 filters 最后（uniquifier 之后）
  # "engine/processors/@before 0": lua_processor@*llm_processor
  # "engine/filters/@after last": lua_filter@*llm_filter
  # 方案开关（启用 LLM 时一起打开）：同一个键只能出现一次，两个开关用 "switches/+" 一次追加；key_binder 用 "/+" 追加，不要整体替换官方绑定
  # "switches/+":
  #   - { name: ai_rerank, reset: 1, states: [ "AI 关", "AI 开" ], abbrev: [ "AI关", "AI开" ] }
  #   - { name: ai_stage2, reset: 1, states: [ "单段", "两段" ], abbrev: [ "单", "两" ] }
  # "key_binder/bindings/+":
  #   - { when: always, toggle: ai_rerank, accept: "Control+Shift+5" }
  #   - { when: always, toggle: ai_rerank, accept: "Control+Shift+percent" }
  # llm_rerank:
  #   enabled: true
  #   code_pattern: '[a-z]{3,}'   # 与 Mac 一致：避开 1~2 个字母的简拼
  #   expected_length_weight: 0
  #   cpu_cores: 4                # 学生模型很小，4 线程足够（实机打分 4~6 ms）
  #   max_candidates: 5
  #   persist_freq: false
  #   two_stage_max_chars: 4
  #   # context_source: history   # 排查用：和 Mac 一样只用本会话上屏的词（默认 auto：UIA/COM 优先）
